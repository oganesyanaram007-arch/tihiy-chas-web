# ─────────────────────────────────────────────────────────────
#  tihiy-chas.ru — nginx server block (шаблон)
#
#  ВАЖНО: это образец, а не готовый к копированию файл.
#  Перед применением сверьте с текущим конфигом на сервере:
#      sudo nginx -T | less
#  Проверка перед перезагрузкой ОБЯЗАТЕЛЬНА:
#      sudo nginx -t && sudo systemctl reload nginx
#
#  Что чинит этот конфиг:
#   1. Отдаёт настоящий 404 вместо index.html на любой URL
#      (сейчас /sitemap.xml, /robots.txt и /любая-чушь → 200 + главная).
#   2. Включает HTTP/2 (сейчас согласуется HTTP/1.1).
#   3. Добавляет security-заголовки (сейчас нет ни одного).
#   4. Чинит кэширование: сейчас на HTML стоит no-cache, must-revalidate,
#      а на статику нет заголовков вообще.
# ─────────────────────────────────────────────────────────────

# ── TODO: подставьте реальные значения ──
#   root         — где лежат файлы сайта
#   ssl_*        — пути к сертификату (обычно certbot их уже прописал)
#
#  proxy_pass уже выставлен на 127.0.0.1:8080 — это порт из
#  deploy/tihiyapi.service в репозитории бота.
# ────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name tihiy-chas.ru www.tihiy-chas.ru;

    # Let's Encrypt renewal должен работать по HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://tihiy-chas.ru$request_uri;
    }
}

# www → без www, одним прыжком
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tihiy-chas.ru;

    ssl_certificate     /etc/letsencrypt/live/tihiy-chas.ru/fullchain.pem;   # TODO
    ssl_certificate_key /etc/letsencrypt/live/tihiy-chas.ru/privkey.pem;     # TODO

    return 301 https://tihiy-chas.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                                   # ← было HTTP/1.1
    server_name tihiy-chas.ru;

    root /var/www/tihiy-chas;                   # TODO: проверьте путь
    index index.html;

    # ── TLS ──
    ssl_certificate     /etc/letsencrypt/live/tihiy-chas.ru/fullchain.pem;   # TODO
    ssl_certificate_key /etc/letsencrypt/live/tihiy-chas.ru/privkey.pem;     # TODO
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security-заголовки ──
    # HSTS: включайте, только когда убедились, что HTTPS стабилен.
    # Откатить его до истечения max-age нельзя — браузеры кэшируют.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ── Сжатие ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               image/svg+xml;

    # ── API ──
    # Закрыт в robots.txt; поисковикам тут делать нечего.
    location /api/ {
        # Порт берётся из deploy/tihiyapi.service репозитория бота.
        # Здесь стояло 3000 — применив шаблон как есть, вы бы уронили
        # весь API: и бронирование, и кабинет партнёра.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Не давать залипшему бэкенду держать воркер nginx вечно.
        proxy_connect_timeout 5s;
        proxy_send_timeout   15s;
        proxy_read_timeout   15s;

        add_header Cache-Control "no-store" always;
    }

    # ── robots.txt / sitemap.xml ──
    # Явные правила, чтобы их не перехватил никакой fallback.
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /sitemap.xml {
        add_header Content-Type "application/xml; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ── Статика с хэшем/версией в имени — кэшируем надолго ──
    location ~* \.(css|js|png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;  # 30 дней
        try_files $uri =404;
    }

    # ── HTML ──
    # Короткий кэш вместо no-cache: страница может полежать минуту,
    # это заметно снимает нагрузку при медленном сервере.
    # Мини-апп и кабинет Telegram кэширует агрессивно: правку шапки или
    # вёрстки пользователь иначе не увидит неделями. Для них — no-store.
    location ~* ^/(app|tihiy-chas-cabinet|guest)\.html$ {
        add_header Cache-Control "no-store" always;
    }

    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri =404;
    }

    # ── Главное исправление ──
    # Было (предположительно): try_files $uri $uri/ /index.html;
    #   → любой несуществующий URL отдавал 200 + главную страницу.
    # Стало: честный 404.
    # Все внутренние ссылки сайта ведут на реальные .html-файлы,
    # поэтому clean-URL переписывание не нужно.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }
}
